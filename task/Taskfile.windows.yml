version: '3'

tasks:
  setup:
    desc: Setup the development environment for Windows
    cmds:
      - task: :ndi:setup:windows
      - cargo install cargo-packager --locked

  run:
    desc: Run the application on Windows
    deps:
      - :ndi:setup:windows
    cmds:
      - cargo run --release

  build:
    desc: Build the release binary for Windows
    deps:
      - :ndi:setup:windows
    cmds:
      - cargo build --release

  package:
    desc: Package the Windows application
    deps:
      - build
      - task: :common:generate-packager-config
    cmds:
      - cargo packager --config .Packager.{{OS}}.toml -o {{.DIST_DIR}}

  sign:
    desc: Sign the Windows application
    cmds:
      - echo "Windows signing not yet implemented"

version: '3'

tasks:
  setup:
    desc: Setup the development environment for Windows
    cmds:
      - task: :ndi:setup:windows
      - cargo install cargo-packager --locked

  generate:decklink-headers:
    desc: Regenerate DeckLink C headers from IDL (requires cl.exe in PATH or VCVARS_PATH set)
    platforms: [windows]
    dir: vendor/blackmagic/Win/include
    sources:
      - DeckLinkAPI.idl
    generates:
      - generated/DeckLinkAPI.h
      - generated/DeckLinkAPI_i.c
    vars:
      MIDL_PATH: 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.26100.0/x64/midl.exe'
      VCVARS_PATH: 'C:/Program Files/Microsoft Visual Studio/2022/Community/VC/Auxiliary/Build/vcvars64.bat'
    env:
      MIDL_PATH: '{{.MIDL_PATH}}'
      VCVARS_PATH: '{{.VCVARS_PATH}}'
    cmds:
      - mkdir -p generated
      - cmd /c "call "$VCVARS_PATH" && "$MIDL_PATH" DeckLinkAPI.idl /out generated /header DeckLinkAPI.h /iid DeckLinkAPI_i.c /notlb"
      - rm -f generated/DeckLinkAPI_p.c generated/dlldata.c

  generate:icons:
    desc: Generate assets/AppIcon.ico from assets/AppIcon.png
    platforms: [darwin] # Note: sips is macOS-only
    sources:
      - assets/AppIcon.png
    generates:
      - assets/AppIcon.ico
    cmds:
      - mkdir -p .tmp.ico
      - sips --resampleHeightWidth 16 16 assets/AppIcon.png --out .tmp.ico/icon_16.png
      - sips --resampleHeightWidth 24 24 assets/AppIcon.png --out .tmp.ico/icon_24.png
      - sips --resampleHeightWidth 32 32 assets/AppIcon.png --out .tmp.ico/icon_32.png
      - sips --resampleHeightWidth 48 48 assets/AppIcon.png --out .tmp.ico/icon_48.png
      - sips --resampleHeightWidth 64 64 assets/AppIcon.png --out .tmp.ico/icon_64.png
      - sips --resampleHeightWidth 128 128 assets/AppIcon.png --out .tmp.ico/icon_128.png
      - png2ico assets/AppIcon.ico .tmp.ico/icon_16.png .tmp.ico/icon_24.png .tmp.ico/icon_32.png .tmp.ico/icon_48.png .tmp.ico/icon_64.png .tmp.ico/icon_128.png
      - rm -rf .tmp.ico

  run:
    desc: Run the application on Windows
    deps:
      - :ndi:setup:windows
    cmds:
      - cargo run --release -- --console {{.CLI_ARGS}}

  build:
    desc: Build the release binary for Windows
    deps:
      - :ndi:setup:windows
    cmds:
      - cargo build --release

  package:
    desc: Package the Windows application
    deps:
      - build
      - task: :common:generate:packager-config
    cmds:
      - cargo packager --config .Packager.{{OS}}.toml -o {{.DIST_DIR}}

  sign:
    desc: Sign the Windows application
    cmds:
      - echo "Windows signing not yet implemented"

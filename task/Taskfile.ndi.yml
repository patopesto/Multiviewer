version: '3'

vars:
  NDI_VERSION:
    sh: cat vendor/ndi/NDI_SDK_VERSION 2>/dev/null || echo "unknown"
  NDI_CACHE_DIR: vendor/ndi/.cache
  NDI_MACOS_SHA_FILE: vendor/ndi/macos/NDI_SDK_MACOS.sha256
  NDI_MACOS_URL: https://downloads.ndi.tv/SDK/NDI_SDK_Mac/Install_NDI_SDK_v6_Apple.pkg
  NDI_WINDOWS_SHA_FILE: vendor/ndi/windows/NDI_SDK_WINDOWS.sha256
  NDI_WINDOWS_URL: https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20SDK.exe
  NDI_LINUX_SHA_FILE: vendor/ndi/linux/NDI_SDK_LINUX.sha256
  NDI_LINUX_URL: https://downloads.ndi.tv/SDK/NDI_SDK_Linux/Install_NDI_SDK_v6_Linux.tar.gz

tasks:
  setup:
    desc: Set up the NDI SDK for the current OS
    cmds:
      - task: "setup:{{OS}}"

  setup:darwin:
    desc: Download, verify, and extract the macOS NDI SDK v{{.NDI_VERSION}}
    cmds:
      - |
        set -e

        accepted_hashes=()
        while IFS= read -r line || [ -n "$line" ]; do
          line=$(echo "$line" | tr -d '[:space:]')
          [ -z "$line" ] && continue
          case "$line" in \#*) continue ;; esac
          accepted_hashes+=("$(echo "$line" | tr '[:lower:]' '[:upper:]')")
        done < "{{.NDI_MACOS_SHA_FILE}}"

        if [ ${#accepted_hashes[@]} -eq 0 ]; then
          echo "No SHA256 hashes found in {{.NDI_MACOS_SHA_FILE}}" >&2
          exit 1
        fi

        primary_hash="${accepted_hashes[0]}"
        cache_dir="{{.NDI_CACHE_DIR}}/macos/{{.NDI_VERSION}}-${primary_hash}"
        pkg="$cache_dir/ndi-sdk.pkg"
        mkdir -p "$cache_dir"

        if [ ! -f "$pkg" ]; then
          echo "Downloading NDI SDK v{{.NDI_VERSION}} for macOS..."
          curl -L -o "$pkg" "{{.NDI_MACOS_URL}}"
        else
          echo "Using cached NDI SDK pkg at $pkg"
        fi

        actual=$(shasum -a 256 "$pkg" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
        hash_ok=false
        for h in "${accepted_hashes[@]}"; do
          if [ "$actual" = "$h" ]; then
            hash_ok=true
            break
          fi
        done

        if [ "$hash_ok" != true ]; then
          echo "NDI SDK SHA256 mismatch!" >&2
          echo "Expected: ${accepted_hashes[*]}" >&2
          echo "Actual:   $actual" >&2
          echo "The upstream installer may have been rotated. Update vendor/ndi/macos/NDI_SDK_MACOS.sha256." >&2
          exit 1
        fi
        echo "NDI SDK SHA256 verified."

        sdk_dir="$PWD/vendor/ndi/macos/sdk"
        rm -rf "$sdk_dir"
        mkdir -p "$sdk_dir"

        echo "Extracting NDI SDK..."
        pkgutil --expand-full "$pkg" "$sdk_dir/_pkg"

        payload="$sdk_dir/_pkg/NDI_SDK_Component.pkg/Payload"
        if [ ! -d "$payload/NDI SDK for Apple" ]; then
          echo "Could not find NDI SDK payload at $payload/NDI SDK for Apple" >&2
          exit 1
        fi

        mv "$payload/NDI SDK for Apple"/* "$sdk_dir/"
        rm -rf "$sdk_dir/_pkg"

        # Persist NDI_SDK_DIR for cargo so `cargo run` finds the local SDK.
        mkdir -p "$PWD/.cargo"
        printf '[env]\nNDI_SDK_DIR = "%s"\n' "$(cd "$sdk_dir" && pwd)" > "$PWD/.cargo/config.toml"

        echo "NDI SDK v{{.NDI_VERSION}} ready at $sdk_dir"

  setup:windows:
    desc: Download, verify, and install the Windows NDI SDK v{{.NDI_VERSION}}
    env:
      NDI_VERSION: '{{.NDI_VERSION}}'
      NDI_WINDOWS_URL: '{{.NDI_WINDOWS_URL}}'
      NDI_WINDOWS_SHA_FILE: '{{.NDI_WINDOWS_SHA_FILE}}'
      NDI_CACHE_DIR: '{{.NDI_CACHE_DIR}}'
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File task/windows/setup-ndi.ps1

  setup:linux:
    desc: Download, verify, and extract the Linux NDI SDK v{{.NDI_VERSION}}
    env:
      NDI_VERSION: '{{.NDI_VERSION}}'
      NDI_LINUX_URL: '{{.NDI_LINUX_URL}}'
      NDI_LINUX_SHA_FILE: '{{.NDI_LINUX_SHA_FILE}}'
      NDI_CACHE_DIR: '{{.NDI_CACHE_DIR}}'
    cmds:
      - bash task/linux/setup-ndi.sh

  clean:
    desc: Clear the NDI SDK downloads
    cmds:
      - rm -rf vendor/ndi/macos/sdk vendor/ndi/linux/sdk vendor/ndi/windows/sdk

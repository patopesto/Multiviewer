version: '3'

tasks:
  setup:
    desc: Setup the development environment for Linux
    cmds:
      - task: :ndi:setup:linux
      - cargo install cargo-packager --locked

  setup:system-deps:
    desc: Install the Linux build dependencies
    cmds:
      - apt-get update -qq
      - apt-get install -y build-essential clang libclang-dev curl libavahi-client3
    preconditions:
      - command -v apt-get

  generate:icons:
    desc: Generate Linux icon (.pngs)
    platforms: [darwin] # Note: sips is macOS-only
    sources:
      - assets/appicon/AppIcon.png
    generates:
      - assets/appicon/linux/48x48.png
      - assets/appicon/linux/128x128.png
      - assets/appicon/linux/256x256.png
      - assets/appicon/linux/512x512.png
    cmds:
      - mkdir -p assets/appicon/linux
      - sips -z 48 48 assets/appicon/AppIcon.png --out assets/appicon/linux/48x48.png
      - sips -z 128 128 assets/appicon/AppIcon.png --out assets/appicon/linux/128x128.png
      - sips -z 256 256 assets/appicon/AppIcon.png --out assets/appicon/linux/256x256.png
      - sips -z 512 512 assets/appicon/AppIcon.png --out assets/appicon/linux/512x512.png

  run:
    desc: Run the application on Linux
    deps:
      - :ndi:setup:linux
    cmds:
      - cargo run -- {{.CLI_ARGS}}

  build:
    desc: Build the release binary for Linux
    deps:
      - :ndi:setup:linux
    cmds:
      - cargo build --release

  package:
    desc: Package the Linux application
    deps:
      - build
      - task: :common:generate:packager-config
    cmds:
      - cargo packager --config .Packager.{{OS}}.toml -o {{.DIST_DIR}}
      - |
        set -e
        for f in {{.DIST_DIR}}/*.deb {{.DIST_DIR}}/*.AppImage; do
          [ -e "$f" ] || continue
          ext="${f##*.}"
          mv "$f" "{{.DIST_DIR}}/{{.DIST_NAME}}.${ext}"
        done

  sign:
    desc: Sign the Linux application
    cmds:
      - echo "Linux signing not yet implemented"

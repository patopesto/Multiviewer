version: '3'

tasks:
  setup:
    desc: Setup the development environment for Linux
    cmds:
      - task: :ndi:setup:linux
      - cargo install cargo-packager --locked

  setup:system-deps:
    desc: Install the Linux build dependencies (Debian/Ubuntu; needs root or passwordless sudo)
    cmds:
      - |
        set -e
        if ! command -v apt-get >/dev/null 2>&1; then
          echo "No apt-get: install a C/C++ toolchain and libclang for your distribution." >&2
          exit 1
        fi
        SUDO=""
        [ "$(id -u)" -eq 0 ] || SUDO=sudo
        $SUDO apt-get update -qq
        $SUDO apt-get install -y build-essential clang libclang-dev curl

  run:
    desc: Run the application on Linux
    deps:
      - :ndi:setup:linux
    cmds:
      - cargo run --release

  build:
    desc: Build the release binary for Linux
    deps:
      - :ndi:setup:linux
    cmds:
      - cargo build --release

  package:
    desc: Package the Linux application
    deps:
      - build
      - task: :common:generate:packager-config
    cmds:
      - cargo packager --config .Packager.{{OS}}.toml -o {{.DIST_DIR}}

  sign:
    desc: Sign the Linux application
    cmds:
      - echo "Linux signing not yet implemented"

version: '3'

tasks:
  setup:
    desc: Setup the development environment for Linux
    cmds:
      - task: :ndi:setup:linux
      - cargo install cargo-packager --locked

  run:
    desc: Run the application on Linux
    cmds:
      - cargo run --release

  build:
    desc: Build the release binary for Linux
    cmds:
      - cargo build --release

  package:
    desc: Package the Linux application
    deps:
      - build
      - task: :common:generate-packager-config
    cmds:
      - cargo packager --config .Packager.{{OS}}.toml -o {{.DIST_DIR}}

  sign:
    desc: Sign the Linux application
    cmds:
      - echo "Linux signing not yet implemented"

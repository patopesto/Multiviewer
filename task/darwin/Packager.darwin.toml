formats = ["app"]
icons = ["assets/AppIcon.icns"]
resources = [
  "vendor/LICENSE.md",
  "vendor/ndi/macos/sdk/licenses/libndi_licenses.txt",
]

[macos]
frameworks = [
  "vendor/syphon/Syphon.framework",
  "vendor/ndi/macos/sdk/lib/macOS/libndi.dylib",
]
# ScreenCaptureKit's shareable-content API (display discovery) needs 12.3+.
minimum-system-version = "12.3"
entitlements = "task/darwin/entitlements.plist"
# Merged over cargo-packager's generated Info.plist (usage descriptions).
info-plist-path = "task/darwin/Info.plist"
# TODO: replace with your real Developer ID identity, e.g.
# "Developer ID Application: Your Name (TEAM_ID)"
# For CI, set APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD env vars.
signing-identity = "-"

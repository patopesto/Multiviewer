version: '3'

vars:
  ARCH: arm64
  TARGET: aarch64-apple-darwin
  DIST_DMG: "{{.APP_NAME}}_v{{.VERSION}}_{{OS}}_{{ARCH}}.dmg" # Override the name because we force arm64 even on intel mac

tasks:
  setup:
    desc: Setup the development environment for macOS
    cmds:
      - task: :ndi:setup:darwin
      - cargo install cargo-packager --locked

  setup:system-deps:
    desc: Install the macOS build dependencies
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    cmds:
      - brew install create-dmg png2ico  # DMG packaging and windows icons
    preconditions:
      - brew --version

  run:
    desc: Run the application in debug mode
    cmds:
      - cargo run -- {{.CLI_ARGS}}

  build:
    desc: Build the release binary for macOS
    deps:
      - :ndi:setup:darwin
    cmds:
      - cargo build --release

  generate:icons:
    desc: Generate the macOS icon (.icns)
    platforms: [darwin] # Note: sips is macOS-only
    sources:
      - assets/appicon/AppIcon.png
    generates:
      - assets/appicon/darwin/AppIcon.icns
    cmds:
      - mkdir -p .tmp.iconset assets/appicon/darwin
      - sips -z 16 16 assets/appicon/AppIcon.png --out .tmp.iconset/icon_16x16.png
      - sips -z 32 32 assets/appicon/AppIcon.png --out .tmp.iconset/icon_16x16@2x.png
      - sips -z 32 32 assets/appicon/AppIcon.png --out .tmp.iconset/icon_32x32.png
      - sips -z 64 64 assets/appicon/AppIcon.png --out .tmp.iconset/icon_32x32@2x.png
      - sips -z 128 128 assets/appicon/AppIcon.png --out .tmp.iconset/icon_128x128.png
      - sips -z 256 256 assets/appicon/AppIcon.png --out .tmp.iconset/icon_128x128@2x.png
      - sips -z 256 256 assets/appicon/AppIcon.png --out .tmp.iconset/icon_256x256.png
      - sips -z 512 512 assets/appicon/AppIcon.png --out .tmp.iconset/icon_256x256@2x.png
      - sips -z 512 512 assets/appicon/AppIcon.png --out .tmp.iconset/icon_512x512.png
      - sips -z 1024 1024 assets/appicon/AppIcon.png --out .tmp.iconset/icon_512x512@2x.png
      - iconutil -c icns -o assets/appicon/darwin/AppIcon.icns .tmp.iconset
      - rm -rf .tmp.iconset

  package:
    desc: Build the macOS DMG
    deps:
      - build
      - generate:icons
      - task: :common:generate:packager-config
    cmds:
      - cargo packager --target {{.TARGET}} --config .Packager.{{OS}}.toml -o {{.DIST_DIR}}
      - |
        set -e
        dmg="{{.DIST_DIR}}/{{.DIST_DMG}}"
        # Reuse the identity cargo-packager signed the app with.
        identity=$(awk -F'"' '/^signing-identity[[:space:]]*=/ { print $2; exit }' .Packager.{{OS}}.toml)
        rm -f "$dmg"
        create-dmg \
          --volname "{{.APP_NAME}} v{{.VERSION}}" \
          --volicon "assets/appicon/darwin/AppIcon.icns" \
          --app-drop-link 480 170 \
          --icon "{{.APP_NAME}}.app" 180 170 \
          --window-size 600 400 \
          --hide-extension "{{.APP_NAME}}.app" \
          --skip-jenkins \
          --codesign "${identity:--}" \
          "$dmg" \
          "{{.DIST_DIR}}/{{.APP_NAME}}.app"
      - task: sign

  sign:
    desc: Notarize and staple the DMG
    cmds:
      - |
        set -e
        dmg="{{.DIST_DIR}}/{{.DIST_DMG}}"
        if [ ! -f "$dmg" ]; then
          echo "DMG not found: $dmg" >&2
          exit 1
        fi

        if [ -n "${APPLE_KEYCHAIN_PROFILE:-}" ]; then
          echo "Submitting $dmg for notarization (keychain profile)..."
          xcrun notarytool submit "$dmg" --keychain-profile "$APPLE_KEYCHAIN_PROFILE" --wait
        else
          echo "Skipping notarization: set APPLE_KEYCHAIN_PROFILE, or APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID" >&2
          exit 0
        fi

        echo "Stapling notarization ticket to $dmg..."
        xcrun stapler staple "$dmg"

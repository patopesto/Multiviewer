[package]
name = "Multiviewer"
version = "1.0.0"
edition = "2024"
authors = ["Alban Moreon"]
description = "Multi-protocol video multiviewer"
license = "MIT"
homepage = "https://multiviewer.app"
repository = "https://gitlab.com/multiviewer/multiviewer"

[workspace]
members = [".", "src/sources/decklink/bindings"]

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "29"
fontdue = "0.9"
epaint_default_fonts = "0.35"
grafton-ndi = "1.0.0"
uuid = { version = "1", features = ["v4"] }
multiviewer-decklink = { path = "src/sources/decklink/bindings" }
rfd = "0.15"
dirs = "6"

[build-dependencies]
cc = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
syphon-wgpu = "0.3"
syphon-core = "0.3"
objc = "0.2"
core-foundation = "0.10"
av-foundation = "0.8.1"
core-video = "0.6.1"
core-media = "0.8.1"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"


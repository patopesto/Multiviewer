[package]
name = "Multiviewer"
version.workspace = true
edition = "2024"
authors = ["Alban Moreon"]
description = "Multi-protocol video multiviewer"
license = "MIT"
homepage = "https://multiviewer.app"
repository = "https://gitlab.com/multiviewer/multiviewer"

[workspace]
members = [".", "src/sources/decklink/bindings"]

[workspace.package]
version = "0.1.0"

[workspace.lints.clippy]
needless_return = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints]
workspace = true

[profile.dev]
opt-level = 3

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-chrome = "0.7"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "29"
fontdue = "0.9"
epaint_default_fonts = "0.35"
grafton-ndi = "1.0.0"
uuid = { version = "1", features = ["v4"] }
multiviewer-decklink = { path = "src/sources/decklink/bindings" }
rfd = "0.15"
dirs = "6"

[build-dependencies]
cc = "1.0"
embed-resource = "3"

[target.'cfg(target_os = "macos")'.dependencies]
syphon-wgpu = "0.3"
syphon-core = "0.3"
objc = "0.2"
core-foundation = "0.10"
av-foundation = "0.8.1"
screen-capture-kit = "0.7.1"
core-graphics2 = { version = "0.6.1", default-features = false, features = ["display", "window"] }
core-video = "0.6.1"
core-media = "0.8.1"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
spout2 = { package = "spout2-rs", version = "0.1", default-features = false, features = ["dx12"] }
windows-core = "0.62"
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen"] }


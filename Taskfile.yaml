version: '3'

includes:
  ndi: task/Taskfile.ndi.yml
  darwin: task/Taskfile.darwin.yml
  windows: task/Taskfile.windows.yml
  linux: task/Taskfile.linux.yml
  common: task/Taskfile.common.yml

vars:
  APP_NAME: Multiviewer
  VERSION: "1.0.0"
  DIST_DIR: dist

tasks:
  setup:
    desc: Setup the development environment
    cmds:
      - task: "{{OS}}:setup"

  run:
    desc: Run the application
    cmds:
      - task: "{{OS}}:run"

  build:
    desc: Build the application for the current OS
    cmds:
      - task: "{{OS}}:build"

  package:
    desc: Package the application for the current OS
    deps:
      # - check:version
    cmds:
      - task: "{{OS}}:package"

  sign:
    desc: Sign/notarize the application for the current OS
    cmds:
      - task: "{{OS}}:sign"

  check:version:
    desc: Verify packager version matches Cargo.toml
    cmds:
      - |
        set -e
        cargo_version=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        packager_version=$(grep '^version = ' task/Packager.common.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        if [ "$cargo_version" != "$packager_version" ]; then
          echo "❌ Version mismatch: Cargo.toml=$cargo_version, task/Packager.common.toml=$packager_version"
          exit 1
        fi
        echo "✅ Versions match: $cargo_version"

  test:
    desc: Run clippy and tests
    cmds:
      - cargo clippy
      - cargo test

  clean:
    desc: Clean build and dist directories
    cmds:
      - rm -rf target dist .Packager*

version: '3'

includes:
  ndi: task/Taskfile.ndi.yml
  darwin: task/Taskfile.darwin.yml
  windows: task/Taskfile.windows.yml
  linux: task/Taskfile.linux.yml
  common: task/Taskfile.common.yml

vars:
  APP_NAME: Multiviewer
  DIST_DIR: dist
  VERSION: "0.1.0"
    # sh: grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/'
  DIST_NAME: "{{.APP_NAME}}_v{{.VERSION}}_{{OS}}_{{ARCH}}"

tasks:
  setup:
    desc: Setup the development environment
    cmds:
      - task: "{{OS}}:setup"

  run:
    desc: Run the application
    cmds:
      - task: "{{OS}}:run"

  build:
    desc: Build the application for the current OS
    cmds:
      - task: "{{OS}}:build"

  package:
    desc: Package the application for the current OS
    cmds:
      - task: check:version
      - task: "{{OS}}:package"

  sign:
    desc: Sign/notarize the application for the current OS
    cmds:
      - task: "{{OS}}:sign"

  check:
    desc: Check the application
    cmds:
      - task: check:version
      - task: ndi:check
      - cargo check

  check:version:
    desc: Verify versions are consistent
    platforms: [darwin, linux]
    cmds:
      - |
        set -e
        packager_version=$(grep '^version = ' task/Packager.common.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        if [ "{{.VERSION}}" != "$packager_version" ]; then
          echo "❌ Version mismatch: Cargo.toml={{.VERSION}}, task/Packager.common.toml=$packager_version"
          exit 1
        fi
        echo "✅ task/Packager.common.toml: {{.VERSION}}"

  generate:icons:
    desc: Regenerate platform icon derivatives from assets/appicon/AppIcon.png
    cmds:
      - task: darwin:generate:icons
      - task: windows:generate:icons
      - task: linux:generate:icons

  test:
    desc: Run clippy and tests
    cmds:
      - cargo clippy
      - cargo test

  clean:
    desc: Clean build and dist directories
    cmds:
      - rm -rf target dist .Packager*

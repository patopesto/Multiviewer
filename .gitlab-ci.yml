stages:
  - build
  - release


variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_INCREMENTAL: "0"


.build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - rustup default stable
  script:
    - task setup
    - task package
  cache:
    key: ${CI_JOB_NAME}
    paths:
      - target/
      - .cargo/
      - vendor/ndi/.cache
  artifacts:
    paths:
      - dist/*
    expire_in: 1 day

build-macos:
  extends: .build
  tags:
    - macos
  variables:
    TARGET: "aarch64-apple-darwin"
    CARGO_BUILD_TARGET: "aarch64-apple-darwin"
    # Name of the notarytool profile stored in the runner's keychain. The
    # Developer ID identity is supplied via the APPLE_SIGNING_IDENTITY variable
    # (project CI/CD setting), e.g. "Developer ID Application: Name (TEAMID)".
    APPLE_KEYCHAIN_PROFILE: "multiviewer-notary"
  before_script:
    - !reference [.build, before_script]
    # Fix for macos clang paths to cpp stdlib for decklink builds
    - export CXXFLAGS="-I$(xcrun --sdk macosx --show-sdk-path)/usr/include/c++/v1"
    - rustup target add aarch64-apple-darwin
    # Setup the signing keychain
    - security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_NAME"
    - security set-keychain-settings -u "$KEYCHAIN_NAME" # Prevents auto-locks
    - security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | xargs) # Add keychain to user search path
    - > # Authorise codesign and apple tools to use the content of the keychain
      security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_NAME"
  after_script:
    - security lock-keychain "$KEYCHAIN_NAME"


build-linux-amd64:
  extends: .build
  tags:
    - linux
    - amd64

build-linux-arm64:
  extends: .build
  tags:
    - linux
    - arm64

build-windows:
  extends: .build
  tags:
    - windows
    - amd64


upload:
  stage: release
  image: alpine:3.24.0
  tags:
    - docker
  needs:
    - job: build-macos
      artifacts: true
    - job: build-linux-amd64
      artifacts: true
    - job: build-linux-arm64
      artifacts: true
    - job: build-windows
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl
  script:
    - |
      for file in dist/*; do
        [ -f "$file" ] || continue
        filename=$(basename "$file")
        echo "  -> ${filename}"
        curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${file}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/multiviewer/${CI_COMMIT_TAG}/${filename}"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker
  needs:
    - job: build-macos
      artifacts: true
    - job: build-linux-amd64
      artifacts: true
    - job: build-linux-arm64
      artifacts: true
    - job: build-windows
      artifacts: true
    - job: upload
      artifacts: false
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git jq
  script:
    # --- Generate changelog from commits since previous tag ---
    - |
      prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
      if [ -n "$prev_tag" ]; then
        git log --pretty=format:"- %s" "${prev_tag}"..HEAD > release-description.txt
      else
        echo "Release ${CI_COMMIT_TAG}" > release-description.txt
      fi
    # --- Build release-cli --assets-link flags for all artifacts ---
    - |
      : > release-links.txt
      for file in dist/*; do
        [ -f "$file" ] || continue
        filename=$(basename "$file")
        url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/multiviewer/${CI_COMMIT_TAG}/${filename}"
        name_json=$(echo "$filename" | jq -Rs . | sed 's/^"//;s/"$//')
        url_json=$(echo "$url" | jq -Rs . | sed 's/^"//;s/"$//')
        echo "--assets-link={\"name\":\"${name_json}\",\"url\":\"${url_json}\"}" >> release-links.txt
      done
    # --- Create the GitLab release using release-cli ---
    - |
      echo "Creating GitLab release ${CI_COMMIT_TAG}..."
      set --
      while IFS= read -r line; do
        set -- "$@" "$line"
      done < release-links.txt
      release-cli create \
        --name="${CI_COMMIT_TAG}" \
        --tag-name="${CI_COMMIT_TAG}" \
        --description="$(cat release-description.txt)" \
        "$@"

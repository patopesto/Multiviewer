stages: 
  - test
  - package
  - release

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_INCREMENTAL: "0"

.macos:
  tags:
    - macos
  before_script:
    # Fix for macos clang paths to cpp stdlib for decklink builds
    - export CXXFLAGS="-I$(xcrun --sdk macosx --show-sdk-path)/usr/include/c++/v1"
    - rustup default stable
    - rustup target add aarch64-apple-darwin
  cache:
    key: ${CI_JOB_NAME}
    paths:
      - target/
      - .cargo/
      - vendor/ndi/.cache

test:
  extends: [.macos]
  stage: test
  script:
    - task ndi:setup
    - task test

package:
  extends: [.macos]
  stage: package
  variables:
    TARGET: "aarch64-apple-darwin"
  script:
    - task setup
    - task sign # also runs 'task package' as a dependency
  artifacts:
    paths:
      - dist/*.dmg
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG

release:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      curl --fail --request POST \
        --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
        --form "name=$CI_COMMIT_TAG" \
        --form "tag_name=$CI_COMMIT_TAG" \
        --form "description=Multiviewer $CI_COMMIT_TAG" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
  rules:
    - if: $CI_COMMIT_TAG

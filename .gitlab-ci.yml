stages: 
  - test
  - package
  - release

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_INCREMENTAL: "0"

.macos:
  tags:
    - macos

test:
  extends: [.macos]
  stage: test
  script:
    - task test
  cache:
    key: ${CI_JOB_NAME}
    paths:
      - target/
      - .cargo/

package:
  extends: [.macos]
  stage: package
  before_script:
    - rustup default stable
  script:
    - task setup
    - task sign # also runs 'task package' as a dependency
  artifacts:
    paths:
      - dist/*.dmg
    expire_in: 30 days
  cache:
    key: ${CI_JOB_NAME}
    paths:
      - target/
      - .cargo/
      - /var/cache/multiviewer/
  rules:
    - if: $CI_COMMIT_TAG

release:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      curl --fail --request POST \
        --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
        --form "name=$CI_COMMIT_TAG" \
        --form "tag_name=$CI_COMMIT_TAG" \
        --form "description=Multiviewer $CI_COMMIT_TAG" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
  rules:
    - if: $CI_COMMIT_TAG

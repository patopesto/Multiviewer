version: '3'

tasks:
  install:
    desc: Install website dependencies
    cmds:
      - pnpm install

  run:
    desc: Start the Astro dev server
    cmds:
      - pnpm run dev

  build:
    desc: Build the static site into dist/
    cmds:
      - pnpm run build

  preview:
    desc: Serve the built site locally
    cmds:
      - pnpm run preview

  check:
    desc: Type-check pages, components and content
    cmds:
      - pnpm run check

  clean:
    desc: Remove build output and the Astro cache
    cmds:
      - rm -rf dist .astro
